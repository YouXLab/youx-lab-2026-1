<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Gerenciador de Tarefas</title>

    <link rel="stylesheet" href="desafio%20TABELA.css">
</head>

<body>

<main class="caixaPrin">

    <h1>Gerenciador de Tarefas Web</h1>

    <section class="caixa-formulario">

        <h2>Nova Tarefa</h2>

        <form id="formTarefa">

            <div class="campo campo-grande">
                <label for="nomeTarefa">NOME DA TAREFA</label>

                <input
                        type="text"
                        id="nomeTarefa"
                        placeholder="Digite o nome da tarefa"
                        required
                >
            </div>

            <div class="campo">
                <label for="tipoTarefa">TIPO</label>

                <select id="tipoTarefa" required>
                    <option value="tipo">Selecione</option>
                    <option value="Trabalho">Trabalho</option>
                    <option value="Estudos">Estudos</option>
                    <option value="Pessoal">Pessoal</option>
                </select>
            </div>

            <div class="campo">
                <label for="dataCadastro">DATA DE CADASTRO</label>

                <input
                        type="date"
                        id="dataCadastro"
                        required
                >
            </div>

            <div class="campo">
                <label for="dataTermino">DATA PARA TÉRMINO</label>

                <input
                        type="date"
                        id="dataTermino"
                        required
                >
            </div>

            <div class="campo">
                <label for="statusTarefa">STATUS</label>

                <select id="statusTarefa" required>
                    <option value="Não iniciado">Não iniciado</option>
                    <option value="Em andamento">Em andamento</option>
                    <option value="Finalizado">Finalizado</option>
                </select>
            </div>

            <div class="area-botao">
                <button type="submit" id="botaoCadastrar">
                    + Cadastrar Tarefa
                </button>
            </div>

        </form>

    </section>

    <section class="caixa-tabela">

        <table>

            <thead>
            <tr>
                <th>Tarefa</th>
                <th>Tipo</th>
                <th>Término</th>
                <th>Status</th>
                <th>Prazo</th>
                <th>Ações</th>
            </tr>
            </thead>

            <tbody id="listaTarefas">

            </tbody>

        </table>

    </section>

</main>

<script src="desafio TABELA.js"></script>

</body>

</html>
